<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metro Store | Product Spotlight</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="left-column">
      <img id="mainImage" src="https://via.placeholder.com/500" class="main-img" alt="Primary product image">
      <div class="thumbnails">
        <img onclick="changeImage(this)" src="https://via.placeholder.com/500/333" class="thumb" alt="Variant 1">
        <img onclick="changeImage(this)" src="https://via.placeholder.com/500/666" class="thumb" alt="Variant 2">
        <img onclick="changeImage(this)" src="https://via.placeholder.com/500/999" class="thumb" alt="Variant 3">
      </div>
    </div>
    <div class="right-column">
      <h1>Metro Producer Headphones</h1>
      <h2 class="price">$99.99</h2>
      <p class="desc">Clean, modern product layout designed for maximum conversions and an immersive shopping experience.</p>
      <label for="size">Size:</label>
      <select id="size">
        <option>S</option>
        <option>M</option>
        <option>L</option>
        <option>XL</option>
      </select>
      <label for="qty">Quantity:</label>
      <div class="qty-control">
        <button type="button" onclick="changeQty(-1)">-</button>
        <input id="qty" type="number" value="1" min="1">
        <button type="button" onclick="changeQty(1)">+</button>
      </div>
      <button class="add-to-cart" type="button">🛒 Add to Cart</button>
    </div>
  </div>

  <div class="details-section">
    <div class="tabs">
      <button onclick="openTab('description', this)" class="active">Description</button>
      <button onclick="openTab('specs', this)">Specifications</button>
      <button onclick="openTab('reviews', this)">Reviews</button>
    </div>
    <div id="description" class="tab-content active">
      <p>Full description goes here.</p>
    </div>
    <div id="specs" class="tab-content">
      <p>Specifications go here.</p>
    </div>
    <div id="reviews" class="tab-content">
      <p>No reviews yet.</p>
    </div>
  </div>

  <script>
    function changeImage(img) {
      document.getElementById('mainImage').src = img.src;
    }

    function changeQty(val) {
      const qty = document.getElementById('qty');
      qty.value = Math.max(1, parseInt(qty.value, 10) + val);
    }

    function openTab(id, btn) {
      document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.tabs button').forEach(e => e.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
    }
  </script>
</body>
</html>
